[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherbot"
version = "0.1.0"
description = "Polymarket weather bot. Paper mode is the default. Live mode signs and sends orders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "py-clob-client-v2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
weatherbot = "weatherbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
